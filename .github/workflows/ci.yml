name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore OxyKit.Render.slnx
      - name: Build
        run: dotnet build OxyKit.Render.slnx --no-restore -c Release
      - name: Test
        run: |
          dotnet test tests/OxyKit.Render.Api.Tests/OxyKit.Render.Api.Tests.csproj -c Release --no-restore --verbosity normal
          dotnet test tests/OxyKit.Render.Client.Tests/OxyKit.Render.Client.Tests.csproj -c Release --no-restore --verbosity normal
